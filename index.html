<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>MI-a-MEI</title>
    <style>
        :root{
            --bg:#eef3f1;
            --ink:#16302b;
            --mute:#58706a;
            --frame:#d9e5e1;
            --card:#fff;
            --line:#b7cbc5;
            --ok:#1b7a4b;
            --bad:#b3362b;
            --acc:#0f6b73;
            box-sizing:border-box;
            padding-top:env(safe-area-inset-top, 0px);
            padding-bottom:env(safe-area-inset-bottom, 0px);
        }
        html, body{
            background:var(--bg);
        }
        body{
            margin:0;
            color:var(--ink);
            font-family:Georgia, "Times New Roman", serif;
            display:flex;
            justify-content:center;
            padding:16px;
        }
        main{
            width:100%;
            max-width:680px;
        }
        h1{
            font-size:1.5rem;
            margin:0 0 4px;
        }
        p.sub{
            margin:0 0 12px;
            color:var(--mute);
            font-family:system-ui, sans-serif;
            font-size:0.92rem;
            line-height:1.4;
        }
        .bar{
            display:flex;
            justify-content:space-between;
            font-family:system-ui, sans-serif;
            font-size:0.95rem;
            margin-bottom:8px;
        }
        #frame{
            position:relative;
            width:100%;
            aspect-ratio:4/3;
            background:var(--frame);
            border:3px solid var(--line);
            border-radius:10px;
            overflow:hidden;
            touch-action:none;
            user-select:none;
        }
        .tile{
            position:absolute;
            transform:translate(-50%, -50%);
            line-height:1;
            pointer-events:none;
        }
        #frame>.tile{
            filter:blur(1.4px);
            opacity:0.75;
        }
        .tile img{
            width:1em;
            height:1em;
            object-fit:contain;
            display:block;
        }
        #glass{
            position:absolute;
            width:128px;
            height:128px;
            cursor:grab;
            touch-action:none;
            z-index:5;
        }
        #handle{
            position:absolute;
            left:calc(50% - 10px);
            top:50%;
            width:20px;
            height:112px;
            border-radius:10px;
            background:linear-gradient(90deg, #5b3d27, #8a603c, #5b3d27);
            transform-origin:10px 0;
            transform:rotate(-45deg);
            box-shadow:0 3px 8px rgba(0, 0, 0, 0.35);
        }
        #lens{
            position:absolute;
            inset:0;
            border-radius:50%;
            border:8px solid #b9953f;
            background:var(--bg);
            overflow:hidden;
            box-shadow:0 4px 14px rgba(0, 0, 0, 0.4), inset 0 0 12px rgba(255, 255, 255, 0.35);
        }
        #lens:after{
            content:"";
            position:absolute;
            inset:0;
            border-radius:50%;
            background:radial-gradient(circle at 30% 28% rgba(255,255,255,0.35), transparent 40%);
            pointer-events:none;
        }
        #zoom{
            position:absolute;
            left:0;
            top:0;
            transform-origin:0 0;
            pointer-events:none;
        }
        #zoom.tile{
            opacity:1;
        }
        .ctl{
            display:flex;
            align-items:center;
            gap:10px;
            margin-top:10px;
            font-family:system-ui, sans-serif;
            font-size:0.92rem;
        }
        .ctl input{
            flex:1;
            accent-color:var(--acc);
            height:32px;
        }
        .ctl b{
            min-width:3.2em;
            text-align:right;
        }
        #hint{
            font-family:system-ui, sans-serif;
            font-size:0.88rem;
            color:var(--mute);
            margin:8px 0 0;
            min-height:1.3em;
        }
        #modal{
            position:fixed;
            inset:0;
            background:rgba(0, 0, 0, 0.55);
            display:none;
            align-items:center;
            justify-content:center;
            padding:16px;
            z-index:20;
            overflow:auto;
        }
        #modal.on{
            display:flex;
        }
        .card{
            position:relative;
            background:var(--card);
            border-radius:12px;
            padding:20px;
            width:100%;
            max-width:440px;
            text-align:center;
            font-family:system-ui, sans-serif;
            max-height:100%;
            overflow:auto;
        }
        .x{
            position:absolute;
            top:8px;
            right:8px;
            width:38px;
            height:38px;
            border:0;
            border-radius:50%;
            background:transparent;
            color:var(--ink);
            font-size:1.6rem;
            line-height:1;
            cursor:pointer;
        }
        .x:hover, .x:focus-visible{
            background:var(--line);
            outline:none;
        }
        .big{
            font-size:84px;
            line-height:1.1;
        }
        .big img{
            width:400px;
            height:400px;
            object-fit:contain;
            border-radius:8px;
        }
        .card h2{
            font-size:1.1rem;
            margin:8px 0 14px;
            font-family:Georgia, serif;
        }
        .choices{
            display:flex;
            gap:10px;
        }
        .choices button{
            flex:1;
            padding:14px 8px;
            font-size:1rem;
            border:2px solid var(--line);
            background:var(--bg);
            color:var(--ink);
            border-radius:8px;
            cursor:pointer;
        }
        .choices button:hover, .choices button:focus-visible{
            border-color:var(--acc);
            outline:none;
        }
        .choices button:disabled{
            cursor:default;
            opacity:0.55;
        }
        #fb{
            margin:14px 0 0;
            text-align:left;
            line-height:1.45;
            font-size:0.95rem;
        }
        #fb b.ok, .ok{
            color:var(--ok);
        }
        #fb b.bad, .bad{
            color:var(--bad);
        }
        .next{
            margin-top:12px;
            padding:10px 18px;
            border:0;
            border-radius:8px;
            background:var(--acc);
            color:var(--bg);
            font-size:1rem;
            cursor:pointer;
        }
        .row{
            display:flex;
            align-items:center;
            gap:10px;
            text-align:left;
            padding:8px 0;
            border-top:1px solid var(--line);
            font-size:0.92rem;
            line-height:1.35;
        }
        .row .em{
            font-size:30px;
            width:40px;
            text-align:center;
        }
        .row .em img{
            width:32px;
            height:32px;
            object-fit:contain;
            border-radius:5px;
        }
        .sc{
            font-size:2rem;
            margin:4px 0 8px;
            font-family:Georgia, serif;
        }
        #tip{
            position:absolute;
            left:50%;
            bottom:calc(100% + 4px);
            transform:translateX(-50%);
            white-space:nowrap;
            background:var(--ok);
            color:#fff;
            font:600 .85rem system-ui,sans-serif;
            padding:6px 12px;
            border-radius:8px;
            box-shadow:0 2px 8px rgba(0,0,0,.35);
            display:none;
            pointer-events:none;
            z-index:6;
        }
        #tip.on{
            display:block;
        }
        #tip.below{
            bottom:auto;
            top:calc(100% + 4px);
        }
    </style>
    </head>
    <body>
        <main>
            <h1></h1>
            <p class="sub"></p>
            <div class="bar"><span id="found">Answered: 0 / 0</span><span id="score">Correct: 0 &nbsp; Wrong: 0</span></div>
            <div id="frame"><div id="glass" aria-label="Magnifying glass" role="button" tabindex="0"><div id="handle"></div><div id="lens"><div id="zoom"></div></div><div id="tip">Tap the image 🤗</div></div></div>
            <div class="ctl"><label for="zr">Magnification</label><input id="zr" type="range" min="2" max="7" step="0.1" value="4"><b id="zv"></b></div>
            <p id="hint"></p>
        </main>
        <div id="modal"><div class="card" id="qcard">
            <button class="x" id="x" aria-label="Close question">&times;</button>
            <div class="big" id="pic"></div>
            <h2 id="q"></h2>
            <div class="choices"><button id="bL"></button><button id="bR"></button></div>
            <div id="fb"></div>
            <button class="next" id="next" style="display:none;">Continue</button>
            </div> <div class="card" id="scard" style="display:none;"></div>
        </div>
        <script>
            const QUESTION = "What do you think this image represents?";
            const LEFT = "Mitosis", RIGHT="Meiosis";
            const MAX_ANSWERS = 10;
            const POOL = [
                {img: "https://i.imgur.com/fQ3fUmt.jpg", a: "L", why: "A healed wound is considered a result of <b>MITOSIS</b> because the body repairs damaged tissue by triggering surrounding healthy cells to divide and produce exact genetic copies of themselves."},
                {img: "https://i.imgur.com/SYkGhjo.jpg", a: "R", why: "Sexual reproduction relies on <b>MEIOSIS</b> because meiosis halves the chromosome number in sperm and egg cells, ensuring that when they fuse during fertilization, the resulting offspring maintains the correct, normal amount of DNA."},
                {img: "https://i.imgur.com/BhaBYLE.jpg", a: "L", why: "A growing plant is considered to be undergoing <b>MITOSIS</b> because plant growth happens primarily through cell division, where a single parent cell divides to form two genetically identical daughter cells."},
                {img: "https://i.imgur.com/oIMrBDn.jpg", a: "R", why: "<b>MEIOSIS</b> introduces genetic variation by shuffling and randomly distributing multiple eye-color genes into sperm and egg cells, creating the unique combination of melanin instructions that determines an offspring's specific eye shade."},
                {img: "https://i.imgur.com/jz1hfbI.png", a: "L", why: "Growth and development are considered part of <b>MITOSIS</b> because this cellular process increases the total number of cells in a multicellular organism while keeping the genetic code identical."},
                {img: "https://i.imgur.com/HiR3qUV.jpg", a: "R", why: "Cats with mixed or multi-colored coats (such as tortoiseshell or calico cats) are linked to <b>MEIOSIS</b> and sex chromosome genetics because the color genes are carried on the X chromosome."},
                {img: "https://i.imgur.com/Zra1Sdo.jpg", a: "L", why: "A growing nail is considered the result of <b>MITOSIS</b> because living cells in the nail matrix (located beneath the skin at the base of the nail) continuously divide and multiply."},
                {img: "https://i.imgur.com/bl4P7MQ.jpg", a: "R", why: "Hair color is considered under <b>MEIOSIS</b> because meiosis is the exact biological process that shuffles and divides your parents' genes, creating the unique combination of DNA that determines your specific hair pigment."},
                {img: "https://i.imgur.com/FLKPjEf.jpg", a: "L", why: "Embryo development is considered part of <b>MITOSIS</b> (specifically, a series of rapid mitotic divisions called cleavage) because a single-celled zygote must multiply into millions of identical-looking and specialized cells to build a full organism while keeping the exact same genetic instructions."},
                {img: "https://i.imgur.com/Rx810BA.jpg", a: "R", why: "Flowers with different or mixed colors are connected to <b>MEIOSIS</b> because meiosis is the cellular process of sexual reproduction that shuffles, segregates, and recombines genetic material (alleles) from parent plants to produce new color variations in offspring."},
            ];

            const $ = id => document.getElementById(id);
            const frame = $('frame'), glass = $('glass'), zoom = $('zoom'), zr = $('zr'), hint = $('hint');
            const R = 64, BASE = 15, TOL = 0.4, ZS = [2.5, 3, 3.5, 4.5, 5, 5.5, 6, 6.5];
            let items = [], log = [], lx = 0, ly = 0, Z = 4, over = false;
            const sh = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
            const pic = it => it.img ? '<img alt="" src="'+it.img+'">': it.e;
            function mk(it){
                const d = document.createElement('div');
                d.className = 'tile';
                d.style.fontSize = it.s + 'px';
                d.innerHTML = pic(it);
                return d;
            }
            function start(){
                frame.querySelectorAll('.tile').forEach(n => n.remove());
                zoom.innerHTML = '';
                log = [];
                over = false;
                $('modal').classList.remove('on');
                $('scard').style.display = 'none';
                $('qcard').style.display = '';

                const pick = sh(POOL).slice(0, MAX_ANSWERS), cols = 5, rows = Math.ceil(pick.length / cols) + 1;
                const cells = sh([...Array(cols * rows).keys()]).slice(0, pick.length);
                items = pick.map((p, i) => {
                    const c = cells[i] % cols, r = Math.floor(cells[i] / cols);
                    return Object.assign({}, p, {z : p.z || ZS[Math.floor(Math.random() * ZS.length)], x : (c + 0.5 +(Math.random() - 0.5) * 0.5) / cols * 100, y : (r + 0.5 + (Math.random() - 0.5) * 0.4) / rows * 100, s : BASE + Math.round(Math.random() * 4), done : false})
                });
                items.forEach(it => {
                    it.t = mk(it);
                    it.zt = mk(it);
                    [it.t, it.zt].forEach(t => {
                        t.style.left = it.x + '%';
                        t.style.top = it.y + '%'
                    });
                    frame.appendChild(it.t);
                    zoom.appendChild(it.zt)
                });
                frame.appendChild(glass);
                sizeZoom();
                place(frame.clientWidth - R - 30, frame.clientHeight - R -30);
                blur();
                upd();
                hint.textContent = '';
            }

            function sizeZoom(){
                zoom.style.width = frame.clientWidth + 'px';
                zoom.style.height = frame.clientHeight + 'px';
            }

            function place(x, y){
                lx = Math.max(0, Math.min(frame.clientWidth, x)); 
                ly = Math.max(0, Math.min(frame.clientHeight, y));
                glass.style.left = (lx - R) + 'px';
                glass.style.top = (ly - R) + 'px';
                zoom.style.transform = 'translate(' + (R - 8 - lx * Z) + 'px, ' + (R - 8  - ly * Z) + 'px) scale('+ Z +')'; tip()
            }

            function blur(){
                items.forEach(it => {
                    if(it.done) return;
                    const d = Math.abs(Z - it.z);
                    it.zt.style.filter = d <= TOL ? 'none' : 'blur(' + Math.min(6, (d - TOL) * 1.2 + 0.6).toFixed(2) +'px)'
                });
            }

            function tip(){
                let on=false;
                items.forEach(it => {
                    if(it.done) return;
                    const d = Math.hypot(it.x / 100 * frame.clientWidth - lx, it.y / 100 * frame.clientHeight - ly);
                    if(d <= 34 && Math.abs(Z-it.z) <= TOL) on = true;
                });
                const t = $('tip');
                t.classList.toggle('on', on);
                t.classList.toggle('below', ly < 50); 
            }

            function upd(){
                const c = log.filter(l => l.ok).length;
                $('found').textContent = 'Answered: ' + log.length + ' / ' + items.length;
                $('score').innerHTML = 'Correct: ' + c + ' &nbsp; Wrong: ' + (log.length - c);
            }

            zr.addEventListener('input', () => {Z =+ zr.value;
                $('zv').textContent = Z.toFixed(1) + 'x';
                place(lx, ly);
                blur()
            });

            let drag = false, moved = 0, ox = 0, oy = 0, sx, sy;

            glass.addEventListener('pointerdown', e => {
                drag = true;
                moved = 0;
                sx = e.clientX;
                sy = e.clientY;
                const b = frame.getBoundingClientRect();
                ox = lx - (e.clientX - b.left);
                oy = ly - (e.clientY - b.top);
                glass.setPointerCapture(e.pointerId);
                glass.style.cursor = 'grabbing'
            });
            
            glass.addEventListener('pointermove', e => {
                if(!drag) return;
                moved += Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy);
                sx = e.clientX;
                sy = e.clientY;
                const b = frame.getBoundingClientRect();
                place(e.clientX - b.left + ox, e.clientY - b.top + oy)
            });

            glass.addEventListener('pointerup', () => {
                drag = false;
                glass.style.cursor = 'grab';
                if(moved < 6) inspect()
            });

            glass.addEventListener('keydown', e => {
                const k = {
                    ArrowLeft : [-12, 0], ArrowRight : [12, 0], ArrowUp : [0, -12], ArrowDown : [0, 12]
                }[e.key];
                if(k){
                    place(lx + k[0], ly + k[1]);
                    e.preventDefault();
                } else if(e.key === 'Enter' || e.key === ' '){
                    inspect(); e.preventDefault()
                }
            });

            window.addEventListener('resize', () => {
                sizeZoom();
                place(lx, ly);
            });

            function inspect(){
                if(over) return;
                let best = null, bd = 1e9;
                items.forEach(it => {
                    if(it.done) return;
                    const d = Math.hypot(it.x / 100 * frame.clientWidth - lx, it.y / 100 * frame.clientHeight - ly);
                    if(d < bd){
                        bd = d;
                        best = it
                    }
                });
                if(!best || bd > 34){
                    hint.textContent = 'Nothing under the magnifying glass. Move it over a picture.'; 
                    return;
                } 
                if(Math.abs(Z - best.z) > TOL){
                    hint.textContent = 'Still blurry. Adjust the magnification.'; 
                    return;
                }
                hint.textContent = '';
                ask(best);
            }

            function ask(it){
                $('pic').innerHTML = pic(it);
                $('q').textContent = QUESTION;
                const bL = $('bL'), bR = $('bR'), fb = $('fb'), nx = $('next');
                bL.textContent = LEFT;
                bR.textContent = RIGHT;
                bL.disabled = bR.disabled = false;
                fb.innerHTML = '';
                nx.style.display = 'none';
                const answer = side => {
                    if(over || it.done) return;
                    bL.disabled = bR.disabled = true;
                    const ok = side === it.a;
                    it.done = true;
                    it.t.remove();
                    it.zt.remove();
                    log.push({it, ok, pick : side});
                    fb.innerHTML = (ok ? '<b class="ok">Correct!</b> ' : '<b class="bad">Not quite.</b> The answer is '+(it.a === 'L' ? LEFT : RIGHT) + '. ') + it.why;
                        if(log.length >= items.length) over = true;
                        nx.style.display = 'inline-block';
                        nx.textContent = over ? 'See summary' : 'Continue'; 
                        nx.focus();
                        upd();
                };
                bL.onclick = () => answer('L');
                bR.onclick = () => answer('R');
                const leave = () => {
                    if(over) summary(); else $('modal').classList.remove('on')
                };
                nx.onclick = leave;
                $('x').onclick = leave;
                $('qcard').style.display = '';
                $('scard').style.display = 'none';
                $('modal').classList.add('on');
            }

            function summary(){
                const c = log.filter(l => l.ok).length, name = s => s === 'L' ? LEFT : RIGHT;
                $('scard').innerHTML = '<h2>Summary</h2><div class = "sc">' + c + ' / ' + log.length + ' correct</div><p style="margin: 0 0 10px; color:var(--mute);"> No more answers are accepted. Here is what you found:</p>' + log.map(l => '<div class="row"><div class="em">' + pic(l.it) + '</div><div><b class="' + (l.ok ? 'ok' : 'bad') + '">' + (l.ok ? 'Correct' : 'Wrong') + '</b>. belongs to ' + name(l.it.a) + (l.ok ? '' : ' (you chose ' +name(l.pick)+')') + '<br><span style="color:var(--mute);">' + l.it.why +'</span></div></div>').join('') + '<button class="next" id="reset">Play again.</button>';
                $('qcard').style.display = 'none';
                $('scard').style.display = '';
                $('modal').classList.add('on');
                $('reset').onclick = () => start(); 
            }

            document.addEventListener('keydown', e => {
                if(e.key === 'Escape' && $('modal').classList.contains('on') && $('qcard').style.display !== 'none') $('x').click()
            });

            start();
            
        </script>
    </body>
</html>
